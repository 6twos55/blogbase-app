<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: BlogBase Signature Dark Navy -->
  <rect width="512" height="512" rx="120" fill="#060613" />
  <rect width="492" height="492" x="10" y="10" rx="110" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.12" />

  <!-- Clean Minimalist White Illustration -->
  <g fill="#ffffff">
    <!-- Stylized Fountain Pen Nib (Centered, bold and iconic) -->
    <!-- Nib tip pointing down toward open pages -->
    <path d="M 256 260 L 210 170 C 200 150, 195 120, 205 90 L 307 90 C 317 120, 312 150, 302 170 Z" />
    <!-- Nib slit -->
    <line x1="256" y1="260" x2="256" y2="160" stroke="#060613" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="160" r="10" fill="#060613" />

    <!-- Open Book Pages (Bold, elegant curves) -->
    <!-- Left Page -->
    <path d="M 244 320 C 190 290, 130 295, 90 315 C 80 320, 75 330, 75 342 L 75 388 C 75 396, 82 402, 90 398 C 130 378, 190 372, 244 402 Z" />
    
    <!-- Right Page -->
    <path d="M 268 320 C 322 290, 382 295, 422 315 C 432 320, 437 330, 437 342 L 437 388 C 437 396, 430 402, 422 398 C 382 378, 322 372, 268 402 Z" />

    <!-- Spine knot/dot -->
    <circle cx="256" cy="360" r="6" fill="#060613" />
  </g>
</svg>
